        run: flutter create --project-name story_recap_ai --org com.example --platforms=android,web .
name: Build StoryRecap AI
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Web platforms
        run: flutter create . --project-name story_recap_ai --platforms=android,web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web App
        run: flutter build web --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryRecap-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Web App
        uses: actions/upload-artifact@v4
        with:
          name: StoryRecap-Web-App
          path: build/web/
          if-no-files-found: error
          retention-days: 7
          
